name: Network lab

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  full-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install QEMU and NoCloud seed tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage openssh-client

      - name: Enable KVM access
        run: |
          if [ -c /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle
            test -r /dev/kvm && test -w /dev/kvm
            echo "KVM is accessible to the runner"
          else
            echo "KVM is unavailable; the lab will use QEMU software emulation"
          fi

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install Python and Ansible dependencies
        run: |
          uv sync --locked
          uv run ansible-galaxy collection install -r requirements.yml

      - name: Validate and test the full lab
        run: |
          uv run python scripts/lab.py check
          uv run python -m pytest tests -q
          uv run molecule syntax
          uv run molecule test

      - name: Collect VM logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: network-lab-logs
          path: |
            .lab/run/**/*.log
            .lab/logs/**/*.log
          if-no-files-found: ignore

      - name: Stop any remaining lab processes
        if: always()
        run: uv run python scripts/lab.py down
