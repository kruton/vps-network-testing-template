[project]
name = "vps-network-template"
version = "0.1.0"
description = "Dual-stack VPS firewall integration lab"
requires-python = ">=3.12"
dependencies = [
    "ansible-core>=2.19,<2.22",
    "molecule>=25.7,<27",
    "pytest>=8,<10",
    "pytest-testinfra>=10,<11",
    "PyYAML>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests", "molecule/default/tests"]
