---
- name: Create the virtual network lab
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Boot the topology
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - scripts/lab.py
          - up
        chdir: "{{ playbook_dir }}/../.."
      changed_when: true
